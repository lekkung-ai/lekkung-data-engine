name: Daily Stock Data Engine

on:
  schedule:
    # Kept as a last-resort safety net - GitHub's own schedule trigger has
    # been proven to fire 2-5h late (see docs/external-trigger.md for the
    # measured delay), so the primary trigger is now an external cron
    # (cron-job.org) hitting workflow_dispatch on time instead. This cron
    # entry still exists so the pipeline eventually runs even if the
    # external cron itself is ever down.
    - cron: '11 11 * * 1-5' # 18:11 ICT (UTC+7) Mon-Fri
  workflow_dispatch: # Manual trigger, and the target of the external cron-job.org trigger
    inputs:
      force:
        description: 'Run the full pipeline even if today''s data is already fresh'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main

jobs:
  check-freshness:
    # Guards against a run duplicating a same-day update that's already
    # landed (from the local Task Scheduler job, an earlier workflow_dispatch,
    # or the schedule trigger itself). Applies to every event type now -
    # schedule, workflow_dispatch, and push all skip when today's data is
    # already fresh - except workflow_dispatch with force=true, which always
    # runs (for a manually-forced re-run when you specifically want one).
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout stockdesk (combined.json only)
        uses: actions/checkout@v6
        with:
          repository: lekkung-ai/lekkung-stockdesk
          token: ${{ secrets.DASHBOARD_PAT }}
          sparse-checkout: |
            data/scans/combined.json
          sparse-checkout-cone-mode: false
          path: stockdesk_check

      - name: Check if today's data already pushed
        id: check
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "force=true - running unconditionally."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TODAY_BKK=$(TZ='Asia/Bangkok' date +%Y-%m-%d)
          echo "Today (Asia/Bangkok): $TODAY_BKK"

          FILE="stockdesk_check/data/scans/combined.json"
          if [ ! -f "$FILE" ]; then
            echo "Could not read $FILE - running pipeline to be safe."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          GENERATED_AT=$(python3 -c "import json; print(json.load(open('$FILE')).get('generated_at',''))")
          echo "Latest combined.json generated_at: $GENERATED_AT"

          if [ -z "$GENERATED_AT" ]; then
            echo "generated_at field missing - running pipeline to be safe."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # generated_at already carries its own UTC offset (e.g. "...+07:00"),
          # so its date component IS the Bangkok-local date already - comparing
          # it directly to TODAY_BKK avoids the UTC-runner day-boundary trap.
          DATA_DATE=$(python3 -c "from datetime import datetime; print(datetime.fromisoformat('$GENERATED_AT').date().isoformat())")
          echo "Data date: $DATA_DATE"

          if [ "$DATA_DATE" = "$TODAY_BKK" ]; then
            echo "Today's data ($TODAY_BKK) already exists in lekkung-stockdesk - likely pushed by an earlier run today (local Task Scheduler or an earlier trigger). Skipping (event: ${{ github.event_name }}, force not set)."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Data is stale (latest is $DATA_DATE, today is $TODAY_BKK) - running pipeline."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  run-pipeline:
    needs: check-freshness
    if: needs.check-freshness.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout data_engine repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Cache history data
        uses: actions/cache@v4
        with:
          path: data/history
          key: history-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            history-${{ runner.os }}-

      - name: Checkout stockdesk earnings feed (for lekkung F45 growth source)
        # scan_lekkung_growth.py wants to read the most recently published
        # earnings_feed.json (F45 NetProfit YoY) to use as the primary source
        # for NetProfit_Growth_QoQY. The main stockdesk checkout further down
        # this job is write-only and happens *after* run_all.py finishes, so
        # this early, read-only sparse checkout is the only way the scanner
        # can see it - inherently a day behind (yesterday's F45 feed, since
        # today's hasn't been fetched yet), which is fine for this purpose.
        # Never fails the job - scan_lekkung_growth.py falls back to
        # Yahoo/cache on its own if this file isn't present.
        uses: actions/checkout@v6
        continue-on-error: true
        with:
          repository: lekkung-ai/lekkung-stockdesk
          token: ${{ secrets.DASHBOARD_PAT }}
          sparse-checkout: |
            public/data/earnings/earnings_feed.json
          sparse-checkout-cone-mode: false
          path: stockdesk_earnings_check

      - name: Run Master Pipeline (all)
        id: run_pipeline
        run: python run_all.py all

      - name: Checkout stockdesk repository
        uses: actions/checkout@v6
        with:
          repository: lekkung-ai/lekkung-stockdesk
          token: ${{ secrets.DASHBOARD_PAT }}
          path: stockdesk_repo

      - name: Copy JSON to stockdesk
        run: |
          mkdir -p stockdesk_repo/data/scans
          cp -r data/results/output/*.json stockdesk_repo/data/scans/

      - name: Fetch IAA research (merges with existing file - no gaps)
        # Same script the separate 09:45 ICT iaa-research-morning.yml run
        # uses - merge-by-uuid logic means running it again here at 17:30 is
        # safe/idempotent, just picks up whatever's new since the morning run.
        run: |
          python tools/research/fetch_iaa_research.py \
            --out stockdesk_repo/data/scans/research_iaa.json \
            --pages 3 || echo "fetch_iaa_research failed"

      - name: Post-process StockDesk data
        run: |
          DATESTAMP=$(TZ='Asia/Bangkok' date +%Y-%m-%d)
          echo "Processing for date: $DATESTAMP"
          
          # 1. Save historical snapshot
          mkdir -p stockdesk_repo/data/history/$DATESTAMP
          cp -r data/results/output/*.json stockdesk_repo/data/history/$DATESTAMP/
          
          cd stockdesk_repo
          # Update index.json
          python -c "import json,os,sys; f=sys.argv[1]; d=sys.argv[2]; idx=json.load(open(f)) if os.path.exists(f) else []; idx=sorted(set(idx+[d])); json.dump(idx,open(f,'w'))" "data/history/index.json" "$DATESTAMP"
          
          # 2. Save Big Lot
          python scripts/save_biglot.py "$DATESTAMP" || echo "save_biglot failed"
          
          # 3. Save News
          python scripts/save_news.py || echo "save_news failed"

          # 3b. Save Research (broker analysis)
          python scripts/save_research.py || echo "save_research failed"

          # 4. Save SEC 59-2 / 246
          python -X utf8 scripts/save_sec_reports.py || echo "save_sec_reports failed"

          # 5. Compute scan days
          python -X utf8 scripts/compute_scan_days.py || echo "compute_scan_days failed"

      - name: Commit and Push to stockdesk
        id: push_stockdesk
        # safe_push.py handles the news.json two-writers race (auto-merges a
        # conflict there, aborts cleanly on any other conflicted file, and
        # retries a rejected push up to 3x) instead of a plain
        # add/commit/pull --rebase/push that used to leave the repo stuck
        # mid-rebase for a human to clean up (2026-07-13/07-14 incidents).
        run: |
          cd stockdesk_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python scripts/safe_push.py --repo . --message "Automated data update from Data Engine" --add-all

      - name: Fetch earnings feed (F45 / MD&A / งบการเงิน)
        # Deliberately placed after the main commit+push above, and isolated
        # with continue-on-error - a failure here (or in the commit step
        # below) can never hold back or fail the scan JSON that already
        # landed. Worst case: yesterday's earnings_feed.json stays in place
        # until the next successful run (this one, the 09:45 ICT
        # iaa-research-morning.yml run, or a manual retry).
        continue-on-error: true
        run: |
          cd stockdesk_repo
          python -X utf8 scripts/fetch_earnings.py

      - name: Commit and push earnings feed
        continue-on-error: true
        run: |
          cd stockdesk_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python scripts/safe_push.py --repo . --message "Update earnings feed" --add public/data/earnings/earnings_feed.json

      - name: Commit symbol tracker (data_engine repo)
        # 1_get_symbols.py updates data/symbol_tracker.json (grace-period
        # state for the universe list) - local housekeeping, not on the
        # critical path. Moved to the very end (after the stockdesk push
        # above has already succeeded) and made non-blocking: this step
        # failing (permissions, a push conflict, anything) must never take
        # down the actual scan data push earlier in this job - that was the
        # bug that killed every cloud run since 2026-07-14 (this step used
        # to run right after run_all.py, with no continue-on-error, so a 403
        # here aborted the whole job before it ever reached the stockdesk
        # push steps).
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/symbol_tracker.json
          if git diff --cached --quiet; then
            echo "No change to symbol_tracker.json - nothing to commit."
          else
            git commit -m "Update symbol tracker"
            git pull --rebase
            git push
          fi

      - name: Record pipeline status
        # Runs regardless of what failed above (if: always()), so
        # pipeline_status.json - and the yellow staleness banner it drives -
        # always reflects this run's real outcome instead of silently
        # freezing on whatever the last successful run happened to write.
        # stockdesk_repo may not exist yet if run_all.py itself failed
        # (the checkout step further up only runs on success), hence the
        # fallback clone.
        if: always()
        run: |
          if [ ! -d stockdesk_repo ]; then
            git clone --quiet "https://x-access-token:${{ secrets.DASHBOARD_PAT }}@github.com/lekkung-ai/lekkung-stockdesk.git" stockdesk_repo
          fi
          cd stockdesk_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "${{ steps.run_pipeline.outcome }}" != "success" ]; then
            python scripts/write_pipeline_status.py --status failure --failed-step "Run Master Pipeline (all)" --source cloud
          elif [ "${{ steps.push_stockdesk.outcome }}" != "success" ]; then
            python scripts/write_pipeline_status.py --status failure --failed-step "Commit and Push to stockdesk" --source cloud
          else
            python scripts/write_pipeline_status.py --status success --source cloud
          fi
          python scripts/safe_push.py --repo . --message "Update pipeline status" --add public/data/pipeline_status.json
